name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      # The kagent checks below render the chart, in both kagent APIs.
      - uses: azure/setup-helm@v4
      # kagent needs every tool named in an allowlist to see it at all, and that
      # list lives in YAML nothing type-checks: the chart (rendered for kagent
      # 0.x and 1.x) and the two example sets. v0.4.0 shipped list_releases
      # invisible to both install paths for exactly that reason, and kagent 1.x
      # turns a misspelled name into a ready agent that never calls the tool.
      # main.go is the source of truth; every allowlist must agree with it.
      - name: kagent tool allowlists match the registered tools
        run: ./scripts/check-tool-allowlists.sh

      # The allowlist check above keeps the tools reachable; this one keeps the
      # instructions honest. Both prompt regressions so far were deletions —
      # a rule disappeared while rewording something near it, and the next live
      # run answered confidently and wrongly with nothing downstream able to
      # tell. The clause list is a record of failures we already paid for.
      - name: agent prompt keeps the rules live failures put there
        run: ./scripts/check-agent-prompt.sh

      # kagent 1.x reads none of the 0.x API and 0.x none of 1.x, so the chart
      # picks the shape from the cluster. A wrong branch installs objects that
      # nothing reconciles, silently; pin the branching on every push.
      - name: chart renders each kagent API in its own shape
        run: ./scripts/check-chart-kagent.sh

  # The static checks above compare files. This one installs the chart on a real
  # cluster and asks the running server what it serves — the step whose absence
  # let v0.4.0 ship a chart pinned to the previous image with a tool the agent
  # could not call. Runs against the chart's appVersion, which is always an
  # already-published image on main, and against the CRDs of both kagent lines
  # (pinned in the script).
  chart-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
      - uses: azure/setup-helm@v4
      - run: ./scripts/chart-smoke.sh
