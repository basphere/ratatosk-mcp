{{- /*
The example agent, in whichever kagent API the cluster serves. kagent 1.x
(api.kagent.dev/v1alpha3) does not read kagent.dev/v1alpha2 objects and 0.x
does not know the 1.x group, so the shape follows the cluster, not a value.
The instructions and tool names come from _agent-prompt.tpl for both.

kagent 1.x runs every Agent on a Harness the platform owner creates, and a
fresh kagent install has none. Without kagent.harness the Agent is skipped
rather than failing the install: the server and its RemoteMCPServer still
land, and NOTES.txt says how to add the agent.
*/ -}}
{{- if and .Values.kagent.enabled .Values.kagent.agent.enabled }}
{{- $toolServerNS := "" }}
{{- with .Values.kagent.agent.toolServer.namespace }}
{{- if ne . $.Release.Namespace }}{{ $toolServerNS = . }}{{ end }}
{{- end }}
{{- if include "ratatosk-mcp.kagentV1" . }}
{{- if .Values.kagent.harness }}
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: {{ .Values.kagent.agent.name }}
  labels:
    {{- include "ratatosk-mcp.labels" . | nindent 4 }}
spec:
  harnessRef:
    name: {{ .Values.kagent.harness }}
  template:
    inline:
      description: Reports which CNCF release changes apply to this cluster, with quoted evidence
      modelConfig:
        name: {{ .Values.kagent.modelConfig }}
      systemPrompt: |-
        {{- regexReplaceAll "(?m)^ +$" (include "ratatosk-mcp.agentPrompt" . | nindent 8) "" }}
      tools:
      - mcp:
          server:
            kind: RemoteMCPServer
            name: {{ include "ratatosk-mcp.fullname" . }}
          tools:
          {{- include "ratatosk-mcp.agentToolNames" . | nindent 10 }}
{{- if .Values.kagent.agent.k8sTools }}
      - mcp:
          server:
            kind: RemoteMCPServer
            name: {{ .Values.kagent.agent.toolServer.name }}
{{- with $toolServerNS }}
            namespace: {{ . }}
{{- end }}
          tools:
          {{- include "ratatosk-mcp.k8sToolNames" . | nindent 10 }}
{{- end }}
{{- end }}
{{- else }}
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: {{ .Values.kagent.agent.name }}
  labels:
    {{- include "ratatosk-mcp.labels" . | nindent 4 }}
spec:
  declarative:
    modelConfig: {{ .Values.kagent.modelConfig }}
    stream: true
    systemMessage: |-
      {{- regexReplaceAll "(?m)^ +$" (include "ratatosk-mcp.agentPrompt" . | nindent 6) "" }}
    tools:
    - mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: {{ include "ratatosk-mcp.fullname" . }}
        toolNames:
        {{- include "ratatosk-mcp.agentToolNames" . | nindent 8 }}
      type: McpServer
{{- if .Values.kagent.agent.k8sTools }}
    - mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: {{ .Values.kagent.agent.toolServer.name }}
{{- with $toolServerNS }}
        namespace: {{ . }}
{{- end }}
        toolNames:
        {{- include "ratatosk-mcp.k8sToolNames" . | nindent 8 }}
      type: McpServer
{{- end }}
  description: Reports which CNCF release changes apply to this cluster, with quoted evidence
  type: Declarative
{{- end }}
{{- end }}
